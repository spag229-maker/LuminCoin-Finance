<div class="createTurnover">
    <label class="newOperationName">
        <input type="text" class="regularInt" placeholder="Тип..." id="turnoverType">
    </label>

    <label class="newOperationName">
        <input type="text" class="regularInt" placeholder="Категория..." id="turnoverCategory">
    </label>

    <label class="newOperationName">
        <input type="text" class="regularInt" placeholder="Сумма в $..." id="turnoverAmount">
    </label>

    <label class="newOperationName">
        <input type="text" class="regularInt" placeholder="Дата..." id="turnoverDate">
    </label>

    <label class="newOperationName">
        <input type="text" class="regularInt" placeholder="Комментарий..." id="turnoverComment">
    </label>

    <div class="createTurnover-buttons">
        <button class="greenBtn">Создать</button>
        <button class="redBtn cancelCreateTurnover">Отмена</button>
    </div>
</div>
